# Memecoin Radar ayarları
# Bu dosya panelden de düzenlenebilir. Elle düzenlerseniz yapıyı bozmayın.

# --- Tarama ---
# Tarama sıklığı (dakika): Kaç dakikada bir tarama yapılacağı.
scan_interval_minutes: 6
# En fazla token yaşı (saat): Sadece bu kadar yeni tokenlar izlenir.
token_max_age_hours: 26
# En az likidite ($): Likiditesi bunun altında olan tokenlar elenir.
min_liquidity_usd: 10000
# Bonding curve tokenları dahil: Pump.fun'da henüz havuza geçmemiş tokenlar da izlensin mi.
include_bonding_curve: false

# --- Cüzdan akışı ---
# Whale eşiği ($): Bu tutarın üstündeki alım/satımlar 'whale' sayılır.
whale_min_usd: 1500
# Cüzdan akışı sıklığı (dakika): Cüzdan akışı kaç dakikada bir güncellenir. Sıklaştırmak Helius kredisini hızlı tüketir.
flow_interval_minutes: 15
# İzlenecek en fazla token (akış ve risk): Her turda hacmi en yüksek bu kadar tokenın akışı ve risk kontrolü güncellenir.
flow_max_tokens: 20
# Helius günlük kredi bütçesi: Bu kadar kredi harcanınca akış ertesi güne kadar durur. Ücretsiz plan ayda 1M kredi (~33K/gün).
helius_daily_credit_budget: 30000

# --- Risk ---
# Risk kontrolü sıklığı (dakika): Risk kontrolleri kaç dakikada bir yenilenir. Dev satışı kontrolü Helius kredisi harcar.
risk_interval_minutes: 60
# İlk 10 cüzdan uyarı eşiği (%): İlk 10 cüzdan (havuz/burn hariç) arzın bu yüzdesinden fazlasını tutuyorsa uyar.
top10_holder_warn_pct: 40
# Dev satışında ele: Kapalıyken dev satışı sadece uyarıdır. Açıkken aşağıdaki eşiği aşan tokenlar elenir.
veto_if_dev_sold: false
# Dev satış eleme eşiği (%): 'Dev satışında ele' açıksa: dev elindekinin bu yüzdesinden fazlasını sattıysa token elenir.
dev_sold_veto_pct: 50
# Mint authority açıksa ele: Dev yeni token basabiliyorsa token elenir.
veto_if_mint_authority: true
# Freeze authority açıksa ele: Dev tokenları dondurabiliyorsa token elenir.
veto_if_freeze_authority: true

# --- Skor ve uyarı ---
# En düşük uyarı skoru: Bu skorun altındaki tokenlar Telegram'a gönderilmez.
min_score_to_alert: 60
score_weights:
  # Ağırlık: whale net akışı: Skor ağırlığı. Üç ağırlığın toplamı 100 olmalı.
  whale_net_flow: 50
  # Ağırlık: alıcı çeşitliliği: Skor ağırlığı. Üç ağırlığın toplamı 100 olmalı.
  buyer_diversity: 30
  # Ağırlık: likidite/MC oranı: Skor ağırlığı. Üç ağırlığın toplamı 100 olmalı.
  liquidity_to_mc: 20
# Risk uyarısı başına ceza (puan): Her ⚠️ risk uyarısı skordan bu kadar puan düşürür.
risk_warn_penalty: 8
# Tekrar uyarı bekleme süresi (saat): Aynı token için bu süre dolmadan tekrar uyarı gönderilmez.
alert_cooldown_hours: 6
# Erken tekrar uyarı için skor artışı: Skor bu kadar artarsa bekleme süresi beklenmeden tekrar uyarılır.
realert_score_jump: 15

# --- Takip ---
# Karşılaştırma grubu oranı (%): Uyarı almayan tokenların bu kadarı karşılaştırma için izlenir.
control_sample_pct: 30
# 'Yükseldi' eşiği (%): 24 saat sonra piyasa değeri bu kadar arttıysa 'yükseldi' sayılır.
outcome_up_pct: 50
# 'Çöktü' eşiği (%): 24 saat sonra piyasa değeri bu kadar düştüyse (veya likidite boşaltıldıysa) 'çöktü' sayılır.
outcome_crash_pct: 70
# Haftalık özet gönder: Her hafta Telegram'a performans özeti gönderilir.
weekly_summary_enabled: true
# Haftalık özet günü (1=Pzt … 7=Paz): Özetin gönderileceği gün.
weekly_summary_day: 1
# Haftalık özet saati: Türkiye saatiyle. Bilgisayar o saatte kapalıysa açılınca gönderilir.
weekly_summary_hour: 10

# --- Çalışma ---
# Deneme modu (dry run): Açıksa Telegram'a mesaj gönderilmez, sadece terminale ve loga yazılır.
dry_run: false
# 'Çalışıyorum' mesajı sıklığı (saat): Bu aralıkla Telegram'a özet mesajı gönderilir. 0 = kapalı.
heartbeat_hours: 24
